name: 'Classement : corriger un score'

# Lancement manuel seulement (onglet Actions) : lit, corrige ou retire le score d'un joueur du classement quand son
# record date d'avant un rééquilibrage (tools/board-admin.ts). Par défaut, lecture seule.
# Les journaux sont publics : l'outil n'imprime ni pseudo ni identifiant.
on:
  workflow_dispatch:
    inputs:
      view:
        description: 'Vue du classement dont on prend le rang'
        type: choice
        options: [best, time, kills]
        default: best
      rank:
        description: 'Rang du joueur dans cette vue (1 = le premier)'
        type: number
        default: 1
      action:
        description: 'lire = ne rien changer · semaine = reprendre ses scores de la semaine · fixer = écrire la partie ci-dessous · supprimer = retirer le joueur · retablir = remettre un joueur retiré (partie ci-dessous)'
        type: choice
        options: [lire, semaine, fixer, supprimer, retablir]
        default: lire
      stage:
        description: 'fixer : monde atteint (1 à 3, 4 = les trois mondes terminés)'
        type: string
        default: ''
      time:
        description: 'fixer : temps de la partie, minutes:secondes (ex. 24:10)'
        type: string
        default: ''
      kills:
        description: 'fixer : monstres vaincus'
        type: string
        default: ''
      when:
        description: 'retablir : date de la partie, ISO (ex. 2026-11-10T14:44:44Z)'
        type: string
        default: ''
      apply:
        description: 'retablir : appliquer (sinon lecture seule)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lire ou corriger le score
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          BOARD_VIEW: ${{ inputs.view }}
          BOARD_RANK: ${{ inputs.rank }}
          BOARD_ACTION: ${{ inputs.action }}
          BOARD_STAGE: ${{ inputs.stage }}
          BOARD_TIME: ${{ inputs.time }}
          BOARD_KILLS: ${{ inputs.kills }}
          BOARD_WHEN: ${{ inputs.when }}
          BOARD_APPLY: ${{ inputs.apply }}
        run: npx tsx tools/board-admin.ts
