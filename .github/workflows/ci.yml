name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lancement manuel, quand une exécution reste bloquée chez GitHub

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La porte de `just ci`, découpée en tâches parallèles (17 nov. 2026, demande de Jimmy : une CI plus courte, sans
  # retirer de test). Le dépôt est public : les runners de GitHub sont gratuits, la suite e2e tourne en 5 morceaux.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 exige Node ≥ 22.12
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      # types, lint et frontières entre couches, tests sous couverture, code mort, build, bench, simulation de fumée
      - name: just (porte de just check sans les e2e)
        run: just typecheck lint coverage deadcode build bench sim-smoke
      - name: Taille du build (gzip)
        run: |
          du -sh dist
          find dist -name '*.js' -exec gzip -k9 {} \;
          echo "JS gzip total : $(cat dist/assets/*.js.gz dist/*.js.gz | wc -c | awk '{printf "%.0f ko", $1/1024}')"

  e2e:
    runs-on: ubuntu-latest
    # un morceau ≈ 1/5 de la suite (≈ 90 min sur un seul runner en 1.57.0), plus le build du serveur de preview
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur de Playwright
        run: |
          npx playwright install chromium
          # Dépendances système à part, sans bloquer : le 11 nov. 2026 les miroirs Ubuntu ne répondaient plus depuis le
          # runner (trois CI rouges avant le premier test). L'image a déjà les bibliothèques de Chromium, il ne manque
          # que des polices ; si une bibliothèque manquait vraiment, le lancement du navigateur échouerait juste après.
          npx playwright install-deps chromium || echo "::warning::Dépendances système de Playwright non installées (miroirs injoignables)"
      # la suite Playwright complète (desktop et mobile), répartie en 5 morceaux : aucun test retiré
      - name: Playwright (morceau ${{ matrix.shard }}/5)
        run: npx playwright test --trace off --shard=${{ matrix.shard }}/5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-${{ matrix.shard }}
          path: |
            shots/
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur de Playwright
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::Dépendances système de Playwright non installées (miroirs injoignables)"
      - run: npm run build
      - name: 'Lighthouse (porte de phase 5 : perf mobile ≥ 85, accessibilité ≥ 90, PWA 100 ; médiane de 3 runs)'
        run: npm run lh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lighthouse/*.json
          retention-days: 14

  # Une seule coche à lire avant de fusionner : verte si les trois tâches de la porte le sont.
  verify:
    runs-on: ubuntu-latest
    if: always()
    needs: [checks, e2e, lighthouse]
    steps:
      - name: Porte complète
        run: |
          echo "checks=${{ needs.checks.result }} e2e=${{ needs.e2e.result }} lighthouse=${{ needs.lighthouse.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.lighthouse.result }}" = success

  balance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # commentaire d'équilibrage sur la PR
    timeout-minutes: 40 # phase 16 : deux profils de 200 runs ≈ 12–16 min ; phase 37 : trois mondes, runs jusqu'à 30 min de jeu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulation d'équilibrage
        run: |
          mkdir -p sim
          # deux profils : run « nu » (emplacements de départ) et tous les emplacements débloqués (phase 17)
          # phase 43 : le profil nu continue en monde infini (--endless), ses cibles sont vérifiées aussi
          npm run sim -- --runs 200 --bot average --seed 42 --profile naked --endless --until 6000 --out sim/ci-naked.json | tee sim/ci.txt || true
          echo >> sim/ci.txt
          npm run sim -- --runs 200 --bot average --seed 42 --profile maxed --out sim/ci-maxed.json | tee -a sim/ci.txt || true
      - name: Commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '### Équilibrage (bot average, 200 runs, seed 42, profils nu et maxé)\n```\n' + fs.readFileSync('sim/ci.txt', 'utf8').slice(-6000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
