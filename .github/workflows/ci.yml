name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run bench
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: |
            shots/
            playwright-report/
          retention-days: 14
      - name: Taille du build
        run: |
          du -sh dist
          find dist -name '*.js' -exec gzip -k9 {} \; && du -ch dist/**/*.js.gz | tail -1

  balance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Simulation d'équilibrage
        run: npm run sim -- --runs 200 --bot average --seed 42 --out sim/ci.json | tee sim/ci.txt
      - name: Commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '### Équilibrage (bot average, 200 runs, seed 42)\n```\n' + fs.readFileSync('sim/ci.txt', 'utf8').slice(-3000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
