name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # tests Playwright sous SwiftShader puis Lighthouse (3 runs) : annulé à 30 min sur la #30 (25 min sur la #29), à 45 min en 1.30.2 (e2e bonus et glisse)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 exige Node ≥ 22.12
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run bench
      - name: Playwright (fumée WebGL, tactile, relance, captures)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: |
            shots/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Taille du build (gzip)
        run: |
          du -sh dist
          find dist -name '*.js' -exec gzip -k9 {} \;
          echo "JS gzip total : $(cat dist/assets/*.js.gz dist/*.js.gz | wc -c | awk '{printf "%.0f ko", $1/1024}')"
      - name: 'Lighthouse (porte de phase 5 : perf mobile ≥ 85, accessibilité ≥ 90, PWA 100 ; médiane de 3 runs)'
        run: npm run lh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lighthouse/*.json
          retention-days: 14

  balance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # commentaire d'équilibrage sur la PR
    timeout-minutes: 40 # phase 16 : deux profils de 200 runs ≈ 12–16 min ; phase 37 : trois mondes, runs jusqu'à 30 min de jeu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulation d'équilibrage
        run: |
          mkdir -p sim
          # deux profils : run « nu » (emplacements de départ) et tous les emplacements débloqués (phase 17)
          npm run sim -- --runs 200 --bot average --seed 42 --profile naked --out sim/ci-naked.json | tee sim/ci.txt || true
          echo >> sim/ci.txt
          npm run sim -- --runs 200 --bot average --seed 42 --profile maxed --out sim/ci-maxed.json | tee -a sim/ci.txt || true
      - name: Commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '### Équilibrage (bot average, 200 runs, seed 42, profils nu et maxé)\n```\n' + fs.readFileSync('sim/ci.txt', 'utf8').slice(-6000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
